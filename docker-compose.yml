# Simple words: `docker compose up --build` starts the webhook API on port 8000.
# All settings (which LLM, API keys, Slack...) come from your .env file.
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data      # Chroma vector DB: past incidents + runbook index
      - ./out:/app/out        # reports and the Slack dry-run outbox
    restart: unless-stopped
